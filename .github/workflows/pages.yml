# This file is automatically generated from Nix configuration. Do not edit directly.

jobs:
  pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    name: Upload to GitHub pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Free disk space for Nix
        uses: wimpysworld/nothing-but-nix@v10
        with:
          hatchet-protocol: rampage
      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.1
      - name: Cache Nix builds
        uses: Mic92/hestia@v3.0.1
      - name: Load dev environment
        run: |
          nix shell --inputs-from . nixpkgs#direnv -c bash -c '
            direnv allow
            direnv export gha >> "$GITHUB_ENV"
          '
      - name: Build website
        run: nix build .#docs
      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: result/dist/
      - id: deployment
        name: Deploy Pages
        uses: actions/deploy-pages@v5.0.0
name: Upload docs site
"on":
  push:
    branches:
      - main
  workflow_dispatch: {}
permissions:
  contents: read
  id-token: write
  pages: write
